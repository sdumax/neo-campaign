services:
  web:
    build: .
    ports:
      - "5500:5500"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/neo_campaign?schema=public
      - DASHBOARD_USER=admin
      - DASHBOARD_PASSWORD=admin123
      - NODE_ENV=production
    restart: always
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=neo_campaign
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres-data:
